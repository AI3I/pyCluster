[node]
node_call = "N0CALL-1"
node_alias = "pyCluster"
owner_name = "Example Operator"
qth = "Example City"
node_locator = "FN31PR"
motd = "Welcome to pyCluster on N0CALL-1"
branding_name = "pyCluster"
welcome_title = "Hello"
welcome_body = ""
login_tip = "Tip: help shows commands, sh/dx shows recent spots."
show_status_after_login = true
require_password = false
registration_required = false
verified_email_required_for_web = false
verified_email_required_for_telnet = false
initial_grace_logins = 5
support_contact = "sysop@example.org"
website_url = "https://github.com/AI3I/pyCluster"
public_ip_address = ""
public_ipv6_address = ""
prompt_template = "[{timestamp}] {node}{suffix}"

[telnet]
host = "0.0.0.0"
port = 7300
max_clients = 150
idle_timeout_seconds = 0
keepalive_interval_seconds = 300
max_line_length = 512

[web]
trusted_proxies = ["127.0.0.1/32", "::1/128"]
host = "127.0.0.1"
port = 8080
admin_token = ""

[public_web]
trusted_proxies = ["127.0.0.1/32", "::1/128"]
enabled = true
host = "127.0.0.1"
port = 8081
static_dir = "./web/public_dxweb/static"
cty_dat_path = "./data/cty.dat"
wpxloc_raw_path = "./data/wpxloc.raw"

[store]
sqlite_path = "./data/pycluster.db"

[qrz]
username = ""
password = ""
agent = ""
api_url = "https://xmldata.qrz.com/xml/current/"

[satellite]
keps_path = "./data/keps.txt"
prediction_hours = 24
pass_step_seconds = 60
min_elevation_deg = 0.0

[rbn]
enabled = false
# Public Reverse Beacon Network relays use telnet.reversebeacon.net:7000 for CW/RTTY
# and telnet.reversebeacon.net:7001 for FT8. Leave disabled unless this node should
# ingest a direct feed.
host = ""
port = 7000
ports = []
feeds = []
callsign = ""
password = ""
source_node = "RBN"
startup_commands = []
reconnect_seconds = 60

[py_protocol]
# Decentralized metadata exchange is enabled only on authenticated links whose
# peer positively identifies as pyCluster. Disable individual sharing controls
# below when a node should advertise less metadata.
defaults_version = 1
enabled = true
public_web_url = ""
share_node_info = true
share_public_web_url = true
share_locator = true
share_qth = true
share_sysop_contact = true
share_topology = true
share_health = true
share_datasets = true
share_rbn_status = true
share_policy = true
share_clock = true
share_notices = true
notice_severity = "normal"
notice_message = ""
notice_expires_epoch = 0
max_hops = 8
max_records_per_frame = 25
max_frame_bytes = 2048
max_bytes_per_minute = 65536
refresh_seconds = 900
record_ttl_seconds = 86400
