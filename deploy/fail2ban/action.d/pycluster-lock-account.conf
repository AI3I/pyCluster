[Definition]
# Optional account-lock action for structured pyCluster auth failures.
# Enable by adding this action to a jail and setting pycluster_db to the
# active SQLite database path.
#
# Example jail override:
#   action = %(action_)s
#            pycluster-lock-account[pycluster_db="/home/pycluster/pyCluster/data/pycluster.db"]

actionban = /usr/bin/env python3 <pycluster_root>/scripts/lock_user_account.py --db <pycluster_db> --call <F-USER> --reason "Locked by fail2ban after repeated authentication failures from <ip>"

[Init]
pycluster_root = /home/pycluster/pyCluster
pycluster_db = /home/pycluster/pyCluster/data/pycluster.db
