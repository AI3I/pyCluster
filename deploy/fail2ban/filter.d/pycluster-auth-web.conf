[Definition]
# Matches structured pyCluster authentication failures written to
# /var/log/pycluster/authfail.log for the public web login path.
failregex = ^.*AUTHFAIL channel=public-web ip=<HOST> call=<F-USER>[^ ]+</F-USER> reason=[a-z_]+$

# Known-account password failures are protected by pyCluster's durable account
# lock. Do not IP-ban that browser away from the password-reset workflow.
ignoreregex = ^.*AUTHFAIL channel=public-web ip=<HOST> call=[^ ]+ reason=(?:invalid_credentials_verified|account_locked_verified)$
