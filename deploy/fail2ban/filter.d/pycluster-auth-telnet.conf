[Definition]
# General telnet authentication failures. Fast malformed-login scanning is
# handled separately by pycluster-auth-scanner.
failregex = ^.*AUTHFAIL channel=telnet ip=<HOST> call=<F-USER>[^ ]+</F-USER> reason=(?!invalid_callsign$)[a-z_]+$

# Verified accounts with configured recovery mail are durably locked by
# pyCluster itself. Keep their source address able to complete recovery and
# reconnect; malformed and non-recoverable login attempts remain bannable.
ignoreregex = ^.*AUTHFAIL channel=telnet ip=<HOST> call=[^ ]+ reason=(?:bad_password_recoverable|account_locked_recoverable)$
